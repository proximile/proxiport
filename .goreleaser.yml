version: 2

env:
  - CGO_ENABLED=0
  - PROJECT=github.com/proximile/proxiport
builds:
  - id: proxiport
    main: ./cmd/proxiport
    binary: proxiport
    ldflags:
      - '-s -w -X {{.Env.PROJECT}}/share.BuildVersion={{.Version}}'
      - "-extldflags '-static'"
    # Reproducible builds: -trimpath strips local $GOPATH/module paths from the
    # binary; mod_timestamp pins the embedded build time to the commit's, so the
    # same tag rebuilds byte-for-byte.
    flags:
      - -trimpath
    mod_timestamp: '{{ .CommitTimestamp }}'
    # Explicit target list rather than a goos×goarch cross-product: the agent is
    # CGO-free, so it cross-compiles cleanly, and an explicit list ships exactly
    # the intended binaries with no exotic combination sneaking in. Every entry
    # is present in `go tool dist list` and has been build-verified.
    targets:
      # Linux
      - linux_386
      - linux_amd64
      - linux_arm_6
      - linux_arm_7
      - linux_arm64
      - linux_riscv64
      - linux_ppc64
      - linux_ppc64le
      - linux_loong64
      - linux_s390x
      - linux_mips_hardfloat
      - linux_mips_softfloat
      - linux_mipsle_hardfloat
      - linux_mipsle_softfloat
      - linux_mips64_hardfloat
      - linux_mips64_softfloat
      - linux_mips64le_hardfloat
      - linux_mips64le_softfloat
      # macOS
      - darwin_amd64
      - darwin_arm64
      # Windows (arm/arm64/386 intentionally omitted)
      - windows_amd64
      # FreeBSD
      - freebsd_386
      - freebsd_amd64
      - freebsd_arm_6
      - freebsd_arm_7
      - freebsd_arm64
      # freebsd_riscv64 omitted: gopsutil/v3/disk has no freebsd/riscv64 port.
      # OpenBSD
      - openbsd_386
      - openbsd_amd64
      - openbsd_arm64
      # NetBSD
      - netbsd_amd64
      - netbsd_arm64
  - id: proxiportd
    main: ./cmd/proxiportd
    binary: proxiportd
    ldflags:
      - '-s -w -X {{.Env.PROJECT}}/share.BuildVersion={{.Version}}'
      - "-extldflags '-static'"
    flags:
      - -trimpath
    mod_timestamp: '{{ .CommitTimestamp }}'
    env:
      - CGO_ENABLED=1
      # When cross-compiling for linux/arm64 from the x86_64 runner, use
      # the aarch64 cross-toolchain installed by the release workflow.
      # GOARCH evaluates per-target.
      - >-
        {{- if eq .Arch "arm64" -}}
          CC=aarch64-linux-gnu-gcc
        {{- else -}}
          CC=gcc
        {{- end -}}
    # CGO=1 (mattn/go-sqlite3) confines the server to the two arches whose C
    # cross-toolchains the release workflow installs. Widening this set requires
    # dropping CGO (pure-Go sqlite), tracked separately.
    targets:
      - linux_amd64
      - linux_arm64
archives:
  - id: proxiport-only
    name_template: >-
      proxiport_{{ .Version }}_{{ .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
      {{- if .Mips }}_{{ .Mips }}{{ end }}
    ids:
      - proxiport
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - proxiport.example.conf
      - src: opt/systemd/proxiport.service
        dst: proxiport.service
      - LICENSE
      - LICENSE-MIT
      - NOTICE
      - README.md
  - id: proxiportd-only
    name_template: >-
      proxiportd_{{ .Version }}_{{ .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
      {{- if .Mips }}_{{ .Mips }}{{ end }}
    ids:
      - proxiportd
    files:
      - proxiportd.example.conf
      - src: opt/systemd/proxiportd.service
        dst: proxiportd.service
      - src: opt/packaging/proxiport-setup.sh
        dst: proxiport-setup
      - src: frontend/build
        dst: docroot
      - LICENSE
      - LICENSE-MIT
      - NOTICE
      - README.md
nfpms:
  # Agent package: static, ships everywhere proxiport runs as a service.
  - id: proxiport
    package_name: proxiport
    file_name_template: >-
      {{ .PackageName }}_{{ .Version }}_{{ .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
      {{- if .Mips }}_{{ .Mips }}{{ end }}
    ids:
      - proxiport
    vendor: Proximile LLC
    homepage: https://proxiport.net
    maintainer: Proximile LLC <191914090+proximile@users.noreply.github.com>
    description: |-
      ProxiPort agent. Idles on a remote machine, connects out to a
      ProxiPort server over SSH-over-WebSocket, and brings tunnels up
      on demand. Works behind NAT — no inbound firewall rules needed.
    license: AGPL-3.0-or-later
    section: net
    priority: optional
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: ./proxiport.example.conf
        dst: /etc/proxiport/proxiport.example.conf
        type: config|noreplace
      - src: ./opt/systemd/proxiport.service
        dst: /lib/systemd/system/proxiport.service
      - src: ./LICENSE
        dst: /usr/share/doc/proxiport/LICENSE
      - src: ./LICENSE-MIT
        dst: /usr/share/doc/proxiport/LICENSE-MIT
      - src: ./NOTICE
        dst: /usr/share/doc/proxiport/NOTICE
      - src: ./README.md
        dst: /usr/share/doc/proxiport/README.md
    scripts:
      preinstall: ./opt/packaging/preinstall.sh
      postinstall: ./opt/packaging/postinstall.sh
      preremove: ./opt/packaging/preremove.sh
      postremove: ./opt/packaging/postremove.sh
    overrides:
      deb:
        dependencies:
          - libc6
      rpm:
        dependencies:
          - glibc
  # Server package: CGO=1 (sqlite), linux/amd64 + linux/arm64 only.
  - id: proxiportd
    package_name: proxiportd
    file_name_template: >-
      {{ .PackageName }}_{{ .Version }}_{{ .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    ids:
      - proxiportd
    vendor: Proximile LLC
    homepage: https://proxiport.net
    maintainer: Proximile LLC <191914090+proximile@users.noreply.github.com>
    description: |-
      ProxiPort server. Accepts WebSocket connections from ProxiPort
      agents, multiplexes SSH tunnels over them, and exposes a REST
      API + SPA for operators. Self-hosted, AGPL-3.0-or-later.
    license: AGPL-3.0-or-later
    section: net
    priority: optional
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: ./proxiportd.example.conf
        dst: /etc/proxiport/proxiportd.example.conf
        type: config|noreplace
      - src: ./opt/systemd/proxiportd.service
        dst: /lib/systemd/system/proxiportd.service
      - src: ./opt/packaging/proxiport-setup.sh
        dst: /usr/bin/proxiport-setup
        file_info:
          mode: 0755
      # Bundle the built SPA so the server serves a web UI out of the box.
      # postinstall enables doc_root in the seeded config and chowns this
      # tree to the proxiport user. Built by the release workflow before
      # goreleaser runs.
      - src: ./frontend/build
        dst: /var/lib/proxiport/docroot
        type: tree
      - src: ./LICENSE
        dst: /usr/share/doc/proxiportd/LICENSE
      - src: ./LICENSE-MIT
        dst: /usr/share/doc/proxiportd/LICENSE-MIT
      - src: ./NOTICE
        dst: /usr/share/doc/proxiportd/NOTICE
      - src: ./README.md
        dst: /usr/share/doc/proxiportd/README.md
    scripts:
      preinstall: ./opt/packaging/preinstall.sh
      postinstall: ./opt/packaging/postinstall.sh
      preremove: ./opt/packaging/preremove.sh
      postremove: ./opt/packaging/postremove.sh
    overrides:
      deb:
        dependencies:
          - libc6
      rpm:
        dependencies:
          - glibc
checksum:
  name_template: 'checksums.txt'

# Keyless Sigstore signature over the checksums file. Because every artifact's
# hash is listed in checksums.txt, one signature over it transitively covers all
# release artifacts. Verify with:
#   cosign verify-blob --certificate checksums.txt.pem \
#     --signature checksums.txt.sig \
#     --certificate-identity-regexp 'https://github.com/proximile/proxiport' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     checksums.txt
# Requires cosign on PATH and `id-token: write` in the release workflow.
signs:
  - cmd: cosign
    signature: '${artifact}.sig'
    certificate: '${artifact}.pem'
    args:
      - sign-blob
      - '--output-signature=${signature}'
      - '--output-certificate=${certificate}'
      - '${artifact}'
      - '--yes'
    artifacts: checksum
    output: true

# Per-artifact SBOMs (Syft) so downstreams can audit the shipped dependencies.
# Cover both the tarballs/zips and the deb/rpm packages.
sboms:
  - id: archive
    artifacts: archive
  - id: package
    artifacts: package

snapshot:
  version_template: '{{ .Tag }}'
changelog:
  sort: asc
release:
  github:
    owner: proximile
    name: proxiport
  draft: false
  prerelease: false
  make_latest: true
