type: object
description: What the API shows of a stored API token. The token itself is never included.
properties:
  prefix:
    type: string
    description: the 8-character string that identifies the token, unique per user
  name:
    type: string
    description: token name, unique per user
  created_at:
    type: string
    description: date and time when this token was created
    format: date-time
  expires_at:
    type: string
    description: date and time when this token will expire
    format: date-time
  scope:
    type: string
    enum:
      - read
      - read+write
      - clients-auth
    description: what this token is authorized for
