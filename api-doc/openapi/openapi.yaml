openapi: 3.0.1
info:
  title: proxiportd HTTP(S) API
  description: >-
    The API listens on whatever `[api] address` is set to in proxiportd.conf.
    The seeded default is `127.0.0.1:3000`; production setups bind a public
    TLS profile on port 443.
  version: 1.0.0
  license:
    name: AGPL-3.0-or-later
    url: https://raw.githubusercontent.com/proximile/proxiport/main/LICENSE
servers:
  - url: https://yourserver/api/v1
  - url: http://127.0.0.1:3000/api/v1
security:
  - bearer_auth: []
  - basic_auth: []
tags:
  - name: Login
    description: Log in, log out and complete two-factor authentication.
  - name: Auth
    description: Find out which login method the server uses.
  - name: Profile & Info
    description: Your own account, your API tokens and two-factor secret, and the state of the server.
  - name: Clients and Tunnels
    description: Clients, their attributes and access lists, and the tunnels to them, stored tunnels included.
  - name: Client Groups
    description: Named groups of clients.
  - name: Client Auth Credentials
    description: The credentials agents connect with, and pairing codes for installing an agent.
  - name: Commands
    description: Run commands on clients and read the results.
  - name: Scripts
    description: Run scripts on clients.
  - name: Jobs
    description: Scheduled commands and scripts.
  - name: Library
    description: Stored commands and scripts.
  - name: Upload
    description: Push files to clients.
  - name: Monitoring
    description: Measurements from the agents, such as metrics, graphs, processes and mount points.
  - name: Vault
    description: The encrypted vault. Set it up, unlock and lock it, and store and read values.
  - name: Audit Log
    description: Read the audit log and verify its integrity chain.
  - name: Notifications
    description: The log of notifications the server sent.
  - name: Users
    description: API users, their sessions and two-factor secrets.
  - name: User Groups
    description: User groups and their permissions.
