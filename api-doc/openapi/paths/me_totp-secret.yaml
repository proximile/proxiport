get:
 tags:
 - Profile & Info
 summary: Read whether you have a secret key for an Authenticator app
 operationId: MetTotpSecretGet
 description: >-
 Reports only whether this account has a secret key. The secret key and its
 qr image are returned once, in the response to the POST that creates them.
 Requires a token received from `/verify-2fa` endpoint.
 responses:
 '200':
 description: Successful Operation
 content:
 application/json:
 schema:
 $ref: ../components/schemas/TotPStatus.yaml
 '400':
 description: TotP is disabled
 content:
 application/json:
 schema:
 $ref: ../components/schemas/ErrorPayload.yaml
 '401':
 description: >-
 Unauthorized, wrong token type provided (e.g. the one received from
 /login endpoint)
 content:
 application/json:
 schema:
 $ref: ../components/schemas/ErrorPayload.yaml
 '404':
 description: time based one time secret key should be generated for this user
 content:
 application/json:
 schema:
 $ref: ../components/schemas/ErrorPayload.yaml
 '500':
 description: Invalid Operation
 content:
 application/json:
 schema:
 $ref: ../components/schemas/ErrorPayload.yaml
post:
 tags:
 - Profile & Info
 summary: Creates a new secret key for an Authenticator app
 operationId: MetTotpSecretPost
 description: >-
 Creates a new secret key for an Authenticator app only for the first time!
 If another totP secret already exists for this user, an error will appear.
 Requires a valid JWT token received from the `/login` endpoint.
 responses:
 '200':
 description: Successful Operation
 content:
 application/json:
 schema:
 $ref: ../components/schemas/TotP.yaml
 '400':
 description: TotP is disabled
 content:
 application/json:
 schema:
 $ref: ../components/schemas/ErrorPayload.yaml
 '401':
 description: >-
 Unauthorized. A token received from the `/login` endpoint is refused here
 once a totP secret exists.
 content:
 application/json:
 schema:
 $ref: ../components/schemas/ErrorPayload.yaml
 '409':
 description: A totP secret already exists for this user
 content:
 application/json:
 schema:
 $ref: ../components/schemas/ErrorPayload.yaml
 '500':
 description: Invalid Operation
 content:
 application/json:
 schema:
 $ref: ../components/schemas/ErrorPayload.yaml
delete:
 tags:
 - Profile & Info
 summary: >-
 Delete time based one time secret key of the current user. Requires a token
 received from `/verify-2fa` endpoint.
 operationId: MetTotpSecretDelete
 requestBody:
 description: >-
 The current password of the account. Accounts that have no password stored
 in proxiportd, because another system authenticates them, send nothing.
 content:
 '*/*':
 schema:
 type: object
 properties:
 old_password:
 type: string
 description: current password of the account
 required: false
 responses:
 '204':
 description: Successful operation.
 content: {}
 '400':
 description: TotP is disabled
 content:
 '*/*':
 schema:
 $ref: ../components/schemas/ErrorPayload.yaml
 '401':
 description: >-
 Unauthorized, wrong token type provided (e.g. the one received from
 /login endpoint)
 content:
 '*/*':
 schema:
 $ref: ../components/schemas/ErrorPayload.yaml
 '403':
 description: Missing or incorrect old password
 content:
 '*/*':
 schema:
 $ref: ../components/schemas/ErrorPayload.yaml
 '500':
 description: Invalid Operation
 content:
 '*/*':
 schema:
 $ref: ../components/schemas/ErrorPayload.yaml
