delete:
  tags:
    - Users
  summary: Delete one API token of a user. Require admin access
  operationId: UserAPITokenDelete
  description: >-
    Deletes the API token with the given prefix. The token stops
    authenticating on the next request.
  parameters:
    - name: user_id
      in: path
      description: unique user ID
      required: true
      schema:
        type: string
    - name: prefix
      in: path
      description: the 8-character prefix identifying the token to delete
      required: true
      schema:
        type: string
  responses:
    "204":
      description: Successful Operation
      content: {}
    "400":
      description: missing or invalid token prefix
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    "403":
      description: >-
        current user should belong to Administrators group to access this
        resource
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    "404":
      description: the user has no API token with this prefix
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
    "500":
      description: Invalid Operation
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
