get:
  tags:
    - Auth
  summary: Get info on the configured authorization method
  operationId: AuthProviderGet
  security: []
  description: >-
    Tells a client how to log in. The answer is always `built-in`: log in
    through the `/login` endpoint. There is no other login method.
  responses:
    "200":
      description: Success
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../components/schemas/AuthProviderResponse.yaml
    '400':
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorPayload.yaml
