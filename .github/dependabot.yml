# Keep dependencies current across the Go module, the frontend, the docs
# toolchain and the GitHub Actions used by CI. Patch and minor bumps are auto-merged once the
# required checks pass (see dependabot-auto-merge.yml); majors and every
# Actions bump stay manual.
#
# A version must be 7 days old before Dependabot proposes it, so a release
# that is pulled after a compromise never reaches a PR. Security updates are
# not subject to the cooldown.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      go-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # The Node type definitions follow the Node major that CI and the
      # release build run (node-version in the workflows); move them together.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch

  # The documentation toolchain (requirements.in and its hash-locked
  # requirements.txt).
  - package-ecosystem: pip
    directory: /.github/docs
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      docs-minor-and-patch:
        update-types:
          - minor
          - patch
