name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go build, vet, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Full history: golangci-lint's `issues.new` mode needs a git base to
      # diff against. A shallow (depth-1) clone has none, so the new-issue
      # filter is unreliable and can surface the whole pre-existing backlog.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        # Pin an exact patch, not a bare "1.26": a bare minor resolves against
        # setup-go's version manifest, which lags a fresh release, and that
        # once installed a still-vulnerable patch while the fix was already
        # out. go.mod's `go` directive is only a floor, so it will not do this
        # for us. The govulncheck step below is what makes the pin load-bearing
        # — bump this whenever it flags a called stdlib vulnerability.
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.8"
          cache: true

      # golangci-lint's gofmt only sees files it analyses, which is the host
      # GOOS -- share/signal_windows.go sat unformatted behind a build tag
      # where no gate could see it. This checks every tracked .go file
      # directly, on the same `-s` setting golangci-lint uses, so the
      # platform-specific files are covered too.
      - name: gofmt -s (every tracked Go file)
        run: |
          mapfile -t gofiles < <(git ls-files '*.go')
          if [ ${#gofiles[@]} -eq 0 ]; then
            echo "no Go files matched -- the glob is wrong, failing rather than passing vacuously"
            exit 1
          fi
          # Generated output is formatted by its generator, not by hand, and
          # reformatting it here would be undone by the next `make generate`.
          checked=()
          for f in "${gofiles[@]}"; do
            if head -1 "$f" | grep -q 'Code generated .* DO NOT EDIT'; then
              continue
            fi
            checked+=("$f")
          done
          if [ ${#checked[@]} -eq 0 ]; then
            echo "every Go file looked generated -- failing rather than passing vacuously"
            exit 1
          fi
          printf 'checking %d of %d Go files (%d generated, skipped)\n' \
            "${#checked[@]}" "${#gofiles[@]}" "$(( ${#gofiles[@]} - ${#checked[@]} ))"
          unformatted=$(gofmt -s -l "${checked[@]}")
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt -s clean:"
            printf '%s\n' "$unformatted"
            echo "run: gofmt -s -w <file>"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build (proxiportd, CGO=1)
        env:
          CGO_ENABLED: "1"
        run: go build -ldflags "-s -w" -o /tmp/proxiportd ./cmd/proxiportd

      - name: go build (proxiport agent, CGO=0)
        env:
          CGO_ENABLED: "0"
        run: go build -ldflags "-s -w" -o /tmp/proxiport ./cmd/proxiport

      - name: go test (unit, race detector)
        env:
          CGO_ENABLED: "1"
        # BDD tests are excluded here because they spawn proxiportd/proxiport
        # subprocesses via `go run` and route their stderr through a watcher
        # that flags any non-"go: downloading" output. The race detector emits
        # informational notes to stderr that trip the watcher even when the
        # underlying test passes. BDD has its own step below.
        run: go test -race -count=1 $(go list ./... | grep -v '/bdd/')

      - name: go test (bdd, serial, no race)
        env:
          CGO_ENABLED: "1"
        # The BDD suite launches a real proxiportd + proxiport pair per
        # test package and waits for "API Listening" on a per-package
        # port. Running those packages in parallel races on `go run`'s
        # build cache and the subprocess startup, so run them one at a
        # time.
        #
        # This step used to carry continue-on-error, which meant it never
        # gated anything -- and it spent a long time reporting a green tick
        # over four suites that all failed. The stated reason (the
        # per-package configs being gitignored) had already been fixed by
        # the `!bdd/**/proxiport*.conf` negations in .gitignore; what
        # actually broke it was the placeholder-secret startup refusal
        # landing while those committed configs still carried
        # `clientAuth1:1234` and `admin:foobaz`, so proxiportd exited
        # before printing "API Listening". The configs now carry
        # suite-specific credentials, and
        # TestCommittedConfigsCarryNoPlaceholderSecrets fails in the unit
        # step if anyone reintroduces a placeholder.
        #
        # Whole suite is ~90s serial; the timeout is deliberately well
        # above that so a genuine hang is distinguishable from slow CI.
        run: go test -count=1 -p 1 -timeout 8m ./bdd/...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

      # Known-vulnerability scan of the module (deps + the Go stdlib version in
      # go.mod). govulncheck is call-graph aware, so it only fails on vulns
      # actually reachable from our code — low false-positive rate. @latest
      # tracks the newest scanner + Go vuln DB, which is what a security gate
      # wants. CGO=1 so the sqlite-linked server packages analyze as they build.
      # Note: because it queries a live vuln DB, a newly-disclosed reachable vuln
      # can turn main red with no code change — that's intended (you want to
      # know); if it ever proves disruptive, move it to a scheduled run.
      - name: govulncheck (dependency vulnerability scan)
        env:
          CGO_ENABLED: "1"
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  cross:
    name: Agent cross-build (${{ matrix.goos }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The agent ships to every platform listed in .goreleaser.yml, but nothing
    # in this workflow or in the local pre-push gate ever set GOOS. Every file
    # behind a //go:build windows, darwin or *bsd tag was therefore shipped to
    # users without once being compiled, vetted or linted by a gate -- and the
    # server-side lens of that gap is what let a wrong-sized QueryDosDevice
    # buffer and an encoding table covering one of nine Windows code pages sit
    # in a release. This job closes it.
    #
    # Scope is the AGENT, not ./... : the server links cgo sqlite and only
    # builds for linux, so a cross-compile of the whole module is expected to
    # fail on db/sqlite and is not a useful signal.
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, darwin, freebsd, openbsd, netbsd]
    env:
      GOOS: ${{ matrix.goos }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.8"
          cache: true

      - name: go build (agent)
        run: go build -ldflags "-s -w" -o /tmp/proxiport-${{ matrix.goos }} ./cmd/proxiport

      - name: go vet (agent packages)
        # The agent's own transitive package set, so the server's cgo-only
        # packages are excluded without hand-maintaining a list.
        run: go vet $(go list -deps ./cmd/proxiport | grep '^github.com/proximile/proxiport')

      - name: compile test binaries
        # Tests cannot RUN under a foreign GOOS on this runner, but they can be
        # compiled -- which catches a _test.go file for that platform that no
        # longer builds. Without this, a windows-only test could reference a
        # function that has been renamed for years and no gate would notice.
        if: matrix.goos == 'windows' || matrix.goos == 'darwin'
        run: |
          for p in $(go list ./client/...); do
            go test -c -o /dev/null "$p"
          done

      - name: golangci-lint
        # Same .golangci.yml, which runs in new-issues-only mode, so this
        # blocks on findings introduced by the change under review rather than
        # on the backlog these files accumulated while unlinted. Windows and
        # darwin only: that is where the platform-specific source lives.
        if: matrix.goos == 'windows' || matrix.goos == 'darwin'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=8m ./client/...

  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: type-check
        # This carried `|| true` for as long as there was typing debt to
        # tolerate, which meant the job reported a type-check it never
        # performed -- it was exiting 1 with five errors under a green tick.
        # The debt is gone (`process` in vite.config.ts needed @types/node;
        # the rest were unguarded `$page.params.id`, typed optional), so the
        # step blocks now. Warnings are still tolerated by --threshold error.
        #
        # svelte-kit sync first: tsconfig.json extends .svelte-kit/tsconfig.json,
        # which is generated, and CI never generated it. So this step could not
        # have type-checked anything even without the `|| true` -- it failed on
        # "Cannot read file .svelte-kit/tsconfig.json" and that failure was
        # swallowed. `npm run build` passed because the vite plugin syncs
        # implicitly.
        run: |
          npx svelte-kit sync
          npx svelte-check --tsconfig ./tsconfig.json --threshold error

      # The frontend had no test runner at all -- zero spec files, and
      # svelte-check (a type-checker) was the only automated scrutiny the SPA
      # got, over auth and vault-gating code that decides what a user can
      # reach.
      - name: unit tests
        run: npm run test

      - name: build
        run: npm run build

  docs:
    name: MkDocs build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Build docs
        run: mkdocs build --strict --site-dir _site

  shell:
    name: Shell scripts (shellcheck + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # This job installed shellcheck and then never invoked it. The only
      # linting that happened was inside proxiport-setup_test.sh, against
      # proxiport-setup.sh alone -- one script out of ten, while the job's name
      # advertised the whole tree. deploy/demo/deploy.sh, deploy/server/
      # install.sh, the opt/packaging maintainer scripts and the dev runner
      # were linted by nothing at all.
      #
      # Severity is `error`, matching the in-test check. There is a backlog of
      # style/info findings (SC2012, SC2029, SC2294 in deploy/demo/deploy.sh;
      # SC2004 in a scriptRunner fixture) that is deliberately NOT gated here:
      # raising the severity is a separate change with real diffs behind it,
      # and gating at `error` today is what stops a new parse-level break.
      - name: shellcheck (all shell scripts, severity=error)
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "no shell scripts matched -- the glob is wrong, failing rather than passing vacuously"
            exit 1
          fi
          printf 'linting %d scripts\n' "${#scripts[@]}"
          shellcheck -S error "${scripts[@]}"

      # A parse check on every script, independent of shellcheck's opinions.
      - name: bash -n (all shell scripts)
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "no shell scripts matched -- failing rather than passing vacuously"
            exit 1
          fi
          rc=0
          for f in "${scripts[@]}"; do
            bash -n "$f" || { echo "parse error: $f"; rc=1; }
          done
          exit $rc

      - name: proxiport-setup regression tests
        run: bash opt/packaging/proxiport-setup_test.sh
